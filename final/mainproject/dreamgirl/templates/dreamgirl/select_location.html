<!DOCTYPE html>
<html>
<head>
    <title>Select Location</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #07040f;   /* Official light grey */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .select-container {
            background: white;
            padding: 50px 60px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .select-title {
            font-size: 28px;
            color: #0a2240;
            margin-bottom: 30px;
            font-weight: 600;
            border-bottom: 2px solid hsl(194, 97%, 72%);
            display: inline-block;
            padding-bottom: 8px;
        }

        select {
            padding: 10px;
            width: 220px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        button {
            padding: 10px 20px;
            background-color: #0b5ed7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 10px;
        }

        button:hover {
            background-color: #084298;
        }
    </style>
</head>

<body>

<div class="select-container">

    <h2 class="select-title">Select Constituency to View Live Results</h2>

    <form method="get">
        <select name="location">
            {% for loc in locations %}
                <option value="{{ loc }}">{{ loc }}</option>
            {% endfor %}
        </select>

        <button type="submit">View Results</button>
    </form>

</div>

</body>
</html>
