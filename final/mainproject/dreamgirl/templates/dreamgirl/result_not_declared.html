<!DOCTYPE html>
<html>
<head>
<title>Result Status - D-Vote</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI';
     background-color: #020001;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Card Container */
.status-card {
    background:rgba(255,255,255,0.06);
    padding:60px 80px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
    backdrop-filter:blur(10px);
}

/* Title */
.status-title {
    font-size:40px;
    color:#22d3ee;
    margin-bottom:20px;
}

/* Message */
.status-message {
    font-size:35px;
    color:#cbd5e1;
    margin-bottom:25px;
}

/* Timer */
.status-time {
    font-size:18px;
    color:#4ade80;
    font-weight:bold;
}

/* Icon */
.icon {
    font-size:60px;
    margin-bottom:20px;
}
</style>
</head>

<body>

<div class="status-card">

    <div class="icon">⏳</div>

    <div class="status-title">
        Official Results Pending‼️
    </div>

    <div class="status-message">
        The election results will be declared after the official voting period ends.
    </div>

    <div class="status-time">
        📌Result Declaration Time: 21 February 2026 | 6:00 PM
    </div>

</div>

</body>
</html>
